// MX Master 4 — «пустые» клавиши на все кнопки и жесты (2026-10-26).
// Смысл кнопкам задаёт xremap (~/.config/xremap/config.yml), а его — вкладка «Кнопки» виджета мыши.
// Этот файл при смене биндов не правится; таблица кнопка → клавиша продублирована в
// buttons.py (BUTTONS) — менять только вместе.
//
//   жестовая кнопка:   клик F13, вверх F14, вниз F15, влево F16, вправо F17
//   «вперёд»:          клик F19, вверх F18, вниз F20, влево F21, вправо F22
//   «назад»:           клик F23, вверх F24, вниз KEY_FN_F1, влево KEY_FN_F2, вправо KEY_FN_F3
//                      (вверх/вниз повторяются по ходу движения — для громкости и т. п.)
//   haptic-панель:     KEY_FN_F4
//   кнопка за колесом: KEY_FN_F5
//
// DPI и SmartShift задаёт виджет через mousectl — logid их не трогает, иначе перетирал бы
// при каждом пробуждении мыши.
devices: (
{
    name: "MX Master 4";

    buttons: (
        {
            // жестовая кнопка под большим пальцем
            cid: 0xc3;
            action =
            {
                type: "Gestures";
                gestures: (
                    { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F13"]; }; },
                    { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F14"]; }; },
                    { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F15"]; }; },
                    { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F16"]; }; },
                    { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F17"]; }; }
                );
            };
        },
        {
            // «вперёд»
            cid: 0x56;
            action =
            {
                type: "Gestures";
                gestures: (
                    { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F19"]; }; },
                    { direction: "Up";    mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F18"]; }; },
                    { direction: "Down";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F20"]; }; },
                    { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F21"]; }; },
                    { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F22"]; }; }
                );
            };
        },
        {
            // «назад»; вверх/вниз — повтор по ходу движения
            cid: 0x53;
            action =
            {
                type: "Gestures";
                gestures: (
                    { direction: "None";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_F23"]; }; },
                    { direction: "Up";    mode: "OnInterval"; interval: 40; action = { type: "Keypress"; keys: ["KEY_F24"]; }; },
                    { direction: "Down";  mode: "OnInterval"; interval: 40; action = { type: "Keypress"; keys: ["KEY_FN_F1"]; }; },
                    { direction: "Left";  mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_FN_F2"]; }; },
                    { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_FN_F3"]; }; }
                );
            };
        },
        {
            // haptic-панель
            cid: 0x1a0;
            action = { type: "Keypress"; keys: ["KEY_FN_F4"]; };
        },
        {
            // кнопка за колесом
            cid: 0xc4;
            action = { type: "Keypress"; keys: ["KEY_FN_F5"]; };
        }
    );
}
);
